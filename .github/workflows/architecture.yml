name: architecture
on:
  push: { branches: [main] }
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # mode: analyze only reads the repository and writes the Artifact. Nothing is sent.
      - uses: sketio-app/action@abba4f868c08a643f1a377b90907a9f1ccd4b0f3 # v1.5.0
