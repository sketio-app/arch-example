name: architecture
on:
  push: { branches: [main] }
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # mode: analyze only reads the repository and writes the Artifact. Nothing is sent.
      - uses: sketio-app/action@ee2ece31b82c193f9985fe2c0482fe787f9f9f32 # v1.11.0
